---
name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: /tmp/.uv-cache
  PROJECT_PATH: "bumper"
  PYTHON_VERSION: "3.15"

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

jobs:
  prek:
    name: Run prek checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # https://github.com/actions/checkout
      - name: ⤵️ Checkout repository
        uses: actions/checkout@v7.0.1

      # https://github.com/astral-sh/setup-uv
      - name: 🏗 Install uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🏗 Install the project
        run: uv sync --locked --dev

      # https://github.com/j178/prek-action
      - name: Run prek
        uses: j178/prek-action@v3.1.0
        env:
          PREK_SKIP: no-commit-to-branch,mypy,pylint

  code-quality:
    name: Check code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # https://github.com/actions/checkout
      - name: ⤵️ Checkout repository
        uses: actions/checkout@v7.0.1

      # https://github.com/astral-sh/setup-uv
      - name: 🏗 Install uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-local-path: ${{ env.UV_CACHE_DIR }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🏗 Install the project
        run: uv sync --locked --dev

      - name: Run mypy
        run: uv run --frozen mypy ${{ env.PROJECT_PATH }}/
      - name: Pylint review
        run: uv run --frozen pylint ${{ env.PROJECT_PATH }}/

  tests:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs:
      - prek
      - code-quality

    strategy:
      fail-fast: false
      matrix:
        # Compatibility matrix; 3.15 is the default.
        python-version:
          - "3.13"
          - "3.14"
          - "3.15"

    steps:
      # https://github.com/actions/checkout
      - name: ⤵️ Checkout repository
        uses: actions/checkout@v7.0.1

      # https://github.com/astral-sh/setup-uv
      - name: 🏗 Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-local-path: ${{ env.UV_CACHE_DIR }}
          python-version: ${{ matrix.python-version }}

      - name: 🏗 Install the project
        run: uv sync --locked --dev

      - name: Run pytest
        run: uv run --frozen pytest tests --cov=./ --cov-report=xml --junitxml=pytest-report.xml

      # https://github.com/actions/upload-artifact
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pytest-report-${{ matrix.python-version }}
          path: pytest-report.xml
          retention-days: 14

      # https://github.com/codecov/codecov-action
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: coverage
          files: coverage.xml
          flags: python-${{ matrix.python-version }}
          fail_ci_if_error: true

      # https://github.com/codecov/codecov-action
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: pytest-report.xml
          flags: python-${{ matrix.python-version }}
          fail_ci_if_error: false
