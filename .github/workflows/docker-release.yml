---
name: Release Docker image to GitHub ghcr

on:
  push:
    branches:
      # - main
      - dev
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch:
    inputs:
      test_build:
        description: "Build a test image instead of a release image"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      suffix:
        description: "Suffix appended to the version tag for test builds"
        required: false
        default: "rc"
        type: string
      version:
        description: "Version override for test builds (leave empty to use the version from pyproject.toml)"
        required: false
        default: ""
        type: string

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  # optional: attach a own name like "/my-sub-context-container"
  IMAGE_NAME: ${{ github.repository }}

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

jobs:
  push_to_registry:
    name: Push Docker image to GitHub ghcr
    runs-on: ubuntu-latest
    # needs: [scan]  # Only build/push if security passes (or review alerts)

    steps:
      # https://github.com/actions/checkout
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Read the project version
        id: project
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Allow a manual version override for test builds.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.test_build }}" = "true" ] && [ -n "${{ inputs.version }}" ]; then
            echo "effective=$inputs.version" >> "$GITHUB_OUTPUT"
          else
            echo "effective=$version" >> "$GITHUB_OUTPUT"
          fi

      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=test,enable=${{ github.event_name == 'workflow_dispatch' && inputs.test_build == 'true' }}
            type=raw,value=test-${{ steps.project.outputs.effective }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.test_build == 'true' }}
            type=raw,value=${{ inputs.suffix || 'rc' }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.test_build == 'true' }}
            type=raw,value=${{ inputs.suffix || 'rc' }}-${{ steps.project.outputs.effective }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.test_build == 'true' }}
          flavor: |
            # `latest` belongs to a version tag only, never to a branch or a
            # manual run. A manual test build additionally gets `test`/suffix.
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # https://github.com/docker/login-action
      - name: Login to registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # https://github.com/docker/build-push-action
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDTIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ (github.event_name == 'workflow_dispatch' && inputs.test_build == 'true') && format('{0}-{1}', steps.project.outputs.effective, inputs.suffix || 'rc') || fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            REVISION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
